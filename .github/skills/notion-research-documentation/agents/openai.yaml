  short_description: "Notionのコンテンツを調査し、ブリーフやレポートを作成"
  icon_small: "./assets/notion-small.svg"
  icon_large: "./assets/notion.png"
  default_prompt: "Notionでこのトピックを調査し、明確な提言を含む、出典付きのブリーフを作成してください。"

dependencies:
